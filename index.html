<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Limit Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="datetime-local"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="datetime-local"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item {
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .status {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .status.under {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .status.over {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Usage Limit Monitor</h1>
        <p class="subtitle">Track your weekly AI usage against any provider limit</p>

        <form id="usageForm">
            <div class="form-group">
                <label for="resetTime">Current Cycle Start Date & Time</label>
                <input type="datetime-local" id="resetTime" required>
            </div>

            <div class="form-group">
                <label for="currentUsage">Current Usage (%)</label>
                <input type="number" id="currentUsage" min="0" max="100" step="0.1" placeholder="e.g., 45.5" required>
            </div>

            <button type="submit">Calculate</button>
            <div class="error" id="error"></div>
        </form>

        <div class="results" id="results">
            <div class="result-item">
                <div class="result-label">Time Elapsed</div>
                <div class="result-value" id="timeElapsed">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">Current Usage</div>
                <div class="result-value" id="displayUsage">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">Difference</div>
                <div class="result-value" id="difference">-</div>
            </div>

            <div class="status" id="status">-</div>
        </div>
    </div>

    <script>
        document.getElementById('usageForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const resetTimeInput = document.getElementById('resetTime').value;
            const currentUsage = parseFloat(document.getElementById('currentUsage').value);

            // Clear previous error
            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('show');

            // Parse the reset time
            const resetTime = new Date(resetTimeInput);
            const now = new Date();

            // Validation
            if (isNaN(resetTime.getTime())) {
                showError('Please enter a valid reset date and time.');
                return;
            }

            if (resetTime >= now) {
                showError('Cycle start time must be in the past.');
                return;
            }

            if (isNaN(currentUsage) || currentUsage < 0 || currentUsage > 100) {
                showError('Please enter a valid usage percentage (0-100).');
                return;
            }

            // Calculate time elapsed
            const weekDuration = 7 * 24 * 60 * 60 * 1000; // 7 days in milliseconds
            const timeSinceReset = now - resetTime;
            const timeElapsedPercentage = (timeSinceReset / weekDuration) * 100;

            // Ensure we don't go over 100% (in case reset time is more than a week ago)
            const cappedTimeElapsed = Math.min(timeElapsedPercentage, 100);

            // Calculate difference
            const difference = currentUsage - cappedTimeElapsed;

            // Determine status
            const isUnder = difference < 0;
            const statusText = isUnder ? 'UNDER' : 'OVER';
            const statusClass = isUnder ? 'under' : 'over';

            // Display results
            document.getElementById('timeElapsed').textContent = cappedTimeElapsed.toFixed(2) + '%';
            document.getElementById('displayUsage').textContent = currentUsage.toFixed(2) + '%';
            document.getElementById('difference').textContent =
                (difference >= 0 ? '+' : '') + difference.toFixed(2) + '%';

            const statusDiv = document.getElementById('status');
            statusDiv.textContent = statusText;
            statusDiv.className = 'status ' + statusClass;

            // Show results
            document.getElementById('results').classList.add('show');
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('results').classList.remove('show');
        }
    </script>
</body>
</html>
